<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAD Breakegg Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --board:#1F3D2F;
    --board-deep:#152A20;
    --chalk:#F5F3EA;
    --chalk-dim:#B9C4B4;
    --paper:#FFFFFF;
    --paper-soft:#F6F4EC;
    --ink:#1E2420;
    --muted:#6E7A6A;
    --amber:#E8A33D;
    --amber-deep:#C67F1F;
    --line:#E7E3D4;
    --danger:#C1443C;
    --success:#3E8E4F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--paper-soft);}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%, #2A4A3A 0%, var(--board) 55%, var(--board-deep) 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:420px;background:var(--paper);border-radius:16px;padding:32px 28px;box-shadow:0 30px 60px rgba(0,0,0,.35);}
  .login-eyebrow{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--amber-deep);margin:0 0 2px;}
  .login-title{font-size:1.6rem;font-weight:900;margin:0 0 22px;letter-spacing:.5px;}
  .role-toggle{display:flex;background:var(--paper-soft);border-radius:10px;padding:4px;margin-bottom:20px;}
  .role-toggle button{flex:1;padding:10px 0;border:none;border-radius:8px;background:transparent;font-weight:700;color:var(--muted);font-size:.95rem;}
  .role-toggle button.active{background:var(--board);color:var(--chalk);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;background:var(--paper);}
  .field input:focus,.field select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .btn-primary{width:100%;padding:12px;border:none;border-radius:8px;background:var(--amber);color:#2B1B04;font-weight:700;font-size:.98rem;}
  .btn-primary:hover{background:var(--amber-deep);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .link-btn{background:none;border:none;color:var(--amber-deep);font-weight:700;font-size:.85rem;padding:0;}
  .err-msg{color:var(--danger);font-size:.85rem;margin:-6px 0 14px;}
  .login-sub{font-size:.8rem;color:var(--muted);margin-top:16px;line-height:1.5;}

  /* ---------- Shell ---------- */
  #app-shell{display:none;min-height:100vh;flex-direction:column;}
  #app-shell.show{display:flex;}

  .topbar{width:100%;background:var(--board);color:var(--chalk);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;z-index:70;}
  .topbar-brand{font-weight:900;font-size:1.05rem;}
  .hamburger-btn{background:none;border:none;color:var(--chalk);font-size:1.5rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px;}
  .hamburger-btn:hover{background:rgba(245,243,234,.12);}

  .nav-drawer-mask{position:fixed;inset:0;background:rgba(21,42,32,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .nav-drawer-mask.open{opacity:1;pointer-events:auto;}

  .nav-drawer{position:fixed;top:0;left:0;height:100vh;width:260px;max-width:82vw;background:var(--board);color:var(--chalk);padding:20px 14px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s ease;z-index:61;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.25);}
  .nav-drawer.open{transform:translateX(0);}

  .sidebar-brand{font-weight:900;font-size:1.15rem;padding:0 8px 18px;border-bottom:1px dashed rgba(245,243,234,.25);margin-bottom:14px;}
  .sidebar-brand span{display:block;font-family:'Caveat',cursive;font-size:1rem;color:var(--amber);font-weight:700;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:3px;background:none;border:none;color:var(--chalk-dim);text-align:left;width:100%;font-size:.92rem;font-weight:500;}
  .nav-item:hover{background:rgba(245,243,234,.08);color:var(--chalk);}
  .nav-item.active{background:rgba(232,163,61,.18);color:var(--amber);font-weight:700;border-left:3px solid var(--amber);padding-left:9px;}
  .nav-spacer{flex:1;}
  .nav-footer{border-top:1px dashed rgba(245,243,234,.25);padding-top:12px;font-size:.78rem;color:var(--chalk-dim);}
  .nav-footer b{color:var(--chalk);}
  .logout-btn{margin-top:8px;width:100%;padding:8px;border-radius:7px;background:rgba(193,68,60,.2);color:#F3B3AE;border:1px solid rgba(193,68,60,.4);font-weight:700;font-size:.82rem;}

  .content{flex:1;padding:28px 34px;overflow-y:auto;}
  .view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  .view-title{font-size:1.4rem;font-weight:900;margin:0;}
  .view-desc{color:var(--muted);font-size:.88rem;margin:4px 0 0;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .grid{display:grid;gap:16px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat-num{font-size:1.9rem;font-weight:900;font-family:'JetBrains Mono',monospace;}
  .stat-label{font-size:.8rem;color:var(--muted);margin-top:2px;}

  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th{text-align:left;padding:10px 12px;background:var(--paper-soft);color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);}
  td{padding:10px 12px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}

  .btn{padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.85rem;color:var(--ink);}
  .btn:hover{border-color:var(--amber);}
  .btn-amber{background:var(--amber);border-color:var(--amber);color:#2B1B04;}
  .btn-amber:hover{background:var(--amber-deep);}
  .btn-danger{background:var(--paper);border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:.78rem;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;}
  .badge-active{background:rgba(232,163,61,.18);color:var(--amber-deep);}
  .badge-completed{background:rgba(62,142,79,.15);color:var(--success);}
  .badge-cancelled{background:rgba(193,68,60,.12);color:var(--danger);}

  .batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .batch-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;position:relative;}
  .batch-card::before{content:'';position:absolute;top:0;left:18px;width:36px;height:8px;background:var(--amber);border-radius:0 0 6px 6px;}
  .batch-name{font-weight:800;font-size:1.05rem;margin:6px 0 2px;}
  .batch-meta{font-size:.8rem;color:var(--muted);margin-bottom:10px;}
  .batch-code{font-family:'JetBrains Mono',monospace;background:var(--paper-soft);padding:2px 8px;border-radius:6px;font-size:.78rem;letter-spacing:1px;}

  .modal-mask{position:fixed;inset:0;background:rgba(21,42,32,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--paper);border-radius:14px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin-top:0;}

  .tab-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab-strip button{padding:7px 16px;border-radius:20px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:.85rem;}
  .tab-strip button.active{background:var(--board);color:var(--chalk);border-color:var(--board);}

  .tick-yes{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--success);font-weight:700;}
  .tick-no{font-family:'Caveat',cursive;font-size:1.5rem;color:#D8D4C4;font-weight:700;}
  .code-display{font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:700;letter-spacing:6px;color:var(--board);background:var(--paper-soft);padding:14px 20px;border-radius:10px;display:inline-block;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .big{font-size:2.4rem;margin-bottom:6px;}

  .notif-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.88rem;}
  .notif-item:last-child{border-bottom:none;}
  .notif-time{color:var(--muted);font-size:.76rem;white-space:nowrap;font-family:'JetBrains Mono',monospace;}
  .notif-tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--paper-soft);font-size:.72rem;font-weight:700;color:var(--muted);margin-right:6px;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--board);color:var(--chalk);padding:12px 20px;border-radius:10px;font-size:.88rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:100;animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px;}
  .photo-thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1/1;border:1px solid var(--line);background:var(--paper-soft);cursor:pointer;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .photo-del{position:absolute;top:4px;right:4px;background:rgba(21,42,32,.75);color:#fff;border:none;border-radius:6px;width:22px;height:22px;font-size:.75rem;line-height:1;}
  .upload-drop{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);font-size:.85rem;cursor:pointer;}
  .upload-drop:hover{border-color:var(--amber);color:var(--amber-deep);}
  .img-modal img{max-width:90vw;max-height:85vh;border-radius:10px;display:block;}
  .timetable-row{display:grid;grid-template-columns:70px 1fr 1fr 2fr;gap:8px;align-items:center;margin-bottom:8px;}
  .timetable-row input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:.85rem;width:100%;}
  .timetable-row .tt-label{font-weight:700;color:var(--muted);font-size:.8rem;}

  @media (max-width:820px){
    .content{padding:18px;}
    .topbar{padding:12px 16px;}
  }

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <p class="login-eyebrow">MAD Breakegg Program</p>
    <h1 class="login-title">Sign In</h1>
    <div class="role-toggle">
      <button id="role-admin-btn" class="active" onclick="setLoginRole('admin')">Admin</button>
      <button id="role-student-btn" onclick="setLoginRole('student')">Member</button>
    </div>
    <div id="login-form-area"></div>
  </div>
</div>

<div id="app-shell">
  <div id="sidebar"></div>
  <main class="content" id="content"></main>
</div>

<div id="print-area" style="display:none;"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   Batch Program Management System — Data Layer
   Uses window.storage shared storage so Admin and Member see the same data
============================================================ */

const MALAYSIA_STATES = ["Kuala Lumpur","Selangor","Johor","Penang","Sabah","Sarawak","Melaka","Perak","Kedah","Kelantan","Terengganu","Pahang","Negeri Sembilan","Perlis","Putrajaya","Labuan"];

let S = {
  loginRole: 'admin',
  isAdmin: false,
  student: null, // {batchId, studentId, name}
  view: 'dashboard',
  batches: [],
  currentBatchId: null,
  attSession: 1,
  marksTest: 1,
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function getJSON(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function setJSON(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), shared); }
  catch(e){ console.error('storage set failed', key, e); toast('Save failed, please try again'); }
}

async function loadBatches(){ return (await getJSON('batches', true)) || []; }
async function saveBatches(arr){ S.batches = arr; await setJSON('batches', arr, true); }

async function loadBatchData(id){
  const d = (await getJSON('batch-'+id, true)) || { students:[], attendance:{}, attendanceDates:[], checkinCodes:{}, marks:{} };
  if(!d.attendanceDates) d.attendanceDates = [];
  return d;
}
async function saveBatchData(id, data){ await setJSON('batch-'+id, data, true); }

async function loadBatchPhotos(id){ return (await getJSON('batch-photos-'+id, true)) || []; }
async function saveBatchPhotos(id, arr){ await setJSON('batch-photos-'+id, arr, true); }

async function loadBatchMaterials(id){ return (await getJSON('batch-materials-'+id, true)) || { agenda:'', timetable:[] }; }
async function saveBatchMaterials(id, data){ await setJSON('batch-materials-'+id, data, true); }

async function loadAppointments(id){ return (await getJSON('batch-appointments-'+id, true)) || []; }
async function saveAppointments(id, arr){ await setJSON('batch-appointments-'+id, arr, true); }

async function loadRecruitment(id){ return (await getJSON('batch-recruitment-'+id, true)) || []; }
async function saveRecruitment(id, arr){ await setJSON('batch-recruitment-'+id, arr, true); }

async function loadRanking(id){ return (await getJSON('batch-ranking-'+id, true)) || {}; }
async function saveRanking(id, obj){ await setJSON('batch-ranking-'+id, obj, true); }

function dateLabel(dateStr){
  if(!dateStr) return '-';
  const [y,m,d] = dateStr.split('-');
  return d+'/'+m;
}

async function recalcStudentCount(batchId){
  const data = await loadBatchData(batchId);
  const batches = await loadBatches();
  const b = batches.find(x=>x.id===batchId);
  if(b){
    b.studentCount = data.students.filter(s=>(s.status||'approved')==='approved').length;
    await saveBatches(batches);
    S.batches = batches;
  }
}

function copyRegLink(link){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=>toast('Link copied')).catch(()=>toast('Could not copy — select and copy it manually'));
  } else {
    toast('Could not copy — select and copy it manually');
  }
}

function showRegQrModal(link, title, note){
  title = title || 'Registration Link & QR';
  note = note || 'Anyone with this link or QR code can open the registration form directly — no login needed. It only works once this file is hosted on a real domain (e.g. Vercel); inside this preview it\'s illustrative.';
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="text-align:center;">
        <h3>${escapeHtml(title)}</h3>
        <input readonly value="${link}" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:.78rem;margin-bottom:12px;" onclick="this.select()">
        <div id="regqr" style="display:flex;justify-content:center;margin-bottom:10px;"></div>
        <button class="btn btn-amber" onclick="copyRegLink('${link}')">Copy Link</button>
        <p style="font-size:.78rem;color:var(--muted);margin-top:10px;">${escapeHtml(note)}</p>
      </div>
    </div>
  `;
  if(window.QRCode){
    const el = document.getElementById('regqr');
    el.innerHTML = '';
    new QRCode(el, { text: link, width: 140, height: 140, colorDark:'#1F3D2F', colorLight:'#ffffff' });
  }
}

function showCredentialsModal(s, batch){
  const appLink = location.origin + location.pathname;
  const msg = `Hi ${s.name}! You're approved for ${batch.name}.\nLogin here: ${appLink}\nChoose "Member", then sign in with:\nPhone: ${s.phone}\nPassword: ${s.password}`;
  const waLink = `https://wa.me/${(s.phone||'').replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`;
  const mailLink = `mailto:${encodeURIComponent(s.email||'')}?subject=${encodeURIComponent('Your '+batch.name+' login details')}&body=${encodeURIComponent(msg)}`;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Send Login Details</h3>
        <p style="font-size:.85rem;color:var(--muted);">This system can't send messages automatically — click a button below to open WhatsApp or Email with the message already written, then hit send yourself.</p>
        <div class="card" style="background:var(--paper-soft);white-space:pre-wrap;font-size:.82rem;margin-bottom:14px;">${escapeHtml(msg)}</div>
        <div class="btn-row">
          <a class="btn btn-amber" href="${waLink}" target="_blank" style="flex:1;text-align:center;text-decoration:none;">Open WhatsApp</a>
          <a class="btn" href="${mailLink}" style="flex:1;text-align:center;text-decoration:none;">Open Email</a>
        </div>
        <button class="btn" style="width:100%;margin-top:10px;" onclick="closeModal()">Close</button>
      </div>
    </div>
  `;
}

async function loadNotifications(){ return (await getJSON('notifications', true)) || []; }
async function logNote(batchId, batchName, type, message){
  const list = await loadNotifications();
  list.unshift({ id: uid('n'), time: new Date().toISOString(), batchId, batchName, type, message });
  if(list.length > 300) list.length = 300;
  await setJSON('notifications', list, true);
}

async function loadAuth(){
  let a = await getJSON('admin-auth', true);
  if(!a){ a = { username:'admin', password:'admin123' }; await setJSON('admin-auth', a, true); }
  return a;
}

function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return fmtDate(iso)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function genCode(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out='';
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function statusLabel(s){ return s==='active' ? 'Active' : s==='completed' ? 'Completed' : 'Cancelled'; }
function statusBadgeClass(s){ return s==='active' ? 'badge-active' : s==='completed' ? 'badge-completed' : 'badge-cancelled'; }

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ============================================================
   Login screen
============================================================ */
function setLoginRole(role){
  S.loginRole = role;
  document.getElementById('role-admin-btn').classList.toggle('active', role==='admin');
  document.getElementById('role-student-btn').classList.toggle('active', role==='student');
  renderLoginForm();
}

function renderLoginForm(){
  const area = document.getElementById('login-form-area');
  if(S.loginRole === 'admin'){
    area.innerHTML = `
      <div class="field"><label>Admin username</label><input id="admin-user" placeholder="admin"></div>
      <div class="field"><label>Password</label><input id="admin-pass" type="password" placeholder="Enter password"></div>
      <div id="admin-err" class="err-msg" style="display:none;"></div>
      <button class="btn-primary" onclick="doAdminLogin()">Sign in to Admin</button>
    `;
  } else {
    area.innerHTML = `
      <div class="field"><label>Phone Number</label><input id="mem-phone" placeholder="Your registered phone number"></div>
      <div class="field"><label>Password</label><input id="mem-pass" type="password" placeholder="Password given to you after approval"></div>
      <div id="mem-err" class="err-msg" style="display:none;"></div>
      <button class="btn-primary" onclick="doMemberLogin()">Sign In</button>
      <p style="text-align:center;color:var(--muted);font-size:.8rem;margin:12px 0;">— OR —</p>
      <button class="btn" style="width:100%;" onclick="showGuestLogin()">Continue as Guest (no password)</button>
      <p class="login-sub">Don't have an account yet? Registration happens through the link or QR code your admin shared for your batch — not on this screen.</p>
    `;
  }
}

function getActiveFormArea(){
  return document.getElementById('pubreg-form-area') || document.getElementById('login-form-area');
}

function showGuestLogin(batchId){
  const area = getActiveFormArea();
  area.innerHTML = `
    <div class="field"><label>Phone Number</label><input id="guest-phone" placeholder="Your registered phone number"></div>
    <div id="guest-err" class="err-msg" style="display:none;"></div>
    <button class="btn-primary" onclick="doGuestLogin()">Continue as Guest</button>
    <p style="font-size:.8rem;color:var(--muted);margin-top:10px;">You must already be an approved member for this to work — this just skips the password step. If you haven't been approved yet, use the registration link/QR your admin shared instead.</p>
    <button class="link-btn" style="margin-top:10px;" onclick="${batchId ? `renderPublicLoginForm('${batchId}')` : 'renderLoginForm()'}">← Back to password sign-in</button>
  `;
}

async function doGuestLogin(){
  const phone = document.getElementById('guest-phone').value.trim();
  const errEl = document.getElementById('guest-err');
  if(!phone){ errEl.textContent = 'Please enter your phone number'; errEl.style.display='block'; return; }
  const batches = await loadBatches();
  S.batches = batches;
  const matches = [];
  for(const b of batches){
    const data = await loadBatchData(b.id);
    const found = data.students.find(s =>
      s.phone.replace(/\s/g,'') === phone.replace(/\s/g,'') &&
      (s.status||'approved') === 'approved'
    );
    if(found) matches.push({ batch: b, student: found });
  }
  if(matches.length === 0){
    errEl.textContent = 'No approved registration found for this phone number';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  if(matches.length === 1){
    enterAsMember(matches[0].batch.id, matches[0].student.id, matches[0].student.name);
  } else {
    window.__batchPickerMatches = matches;
    getActiveFormArea().innerHTML = `
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:12px;">You're approved in more than one batch — choose one:</p>
      ${matches.map((m,i)=>`<button class="btn" style="width:100%;margin-bottom:8px;" onclick="pickMemberBatch(${i})">${escapeHtml(m.batch.name)}</button>`).join('')}
    `;
  }
}

async function doAdminLogin(){
  const user = document.getElementById('admin-user').value.trim();
  const pass = document.getElementById('admin-pass').value;
  const auth = await loadAuth();
  const errEl = document.getElementById('admin-err');
  if(user === auth.username && pass === auth.password){
    S.isAdmin = true; S.student = null;
    errEl.style.display='none';
    await enterApp();
  } else {
    errEl.textContent = 'Incorrect username or password';
    errEl.style.display='block';
  }
}

async function doMemberLogin(){
  const phone = document.getElementById('mem-phone').value.trim();
  const pass = document.getElementById('mem-pass').value.trim();
  const errEl = document.getElementById('mem-err');
  if(!phone || !pass){ errEl.textContent = 'Please enter your phone number and password'; errEl.style.display='block'; return; }
  const batches = await loadBatches();
  S.batches = batches;
  const matches = [];
  for(const b of batches){
    const data = await loadBatchData(b.id);
    const found = data.students.find(s =>
      s.phone.replace(/\s/g,'') === phone.replace(/\s/g,'') &&
      (s.status||'approved') === 'approved' &&
      s.password && s.password.toUpperCase() === pass.toUpperCase()
    );
    if(found) matches.push({ batch: b, student: found });
  }
  if(matches.length === 0){
    errEl.textContent = 'Incorrect phone/password, or your registration is still pending approval';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  if(matches.length === 1){
    enterAsMember(matches[0].batch.id, matches[0].student.id, matches[0].student.name);
  } else {
    window.__batchPickerMatches = matches;
    getActiveFormArea().innerHTML = `
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:12px;">You're approved in more than one batch — choose one:</p>
      ${matches.map((m,i)=>`<button class="btn" style="width:100%;margin-bottom:8px;" onclick="pickMemberBatch(${i})">${escapeHtml(m.batch.name)}</button>`).join('')}
    `;
  }
}

function pickMemberBatch(i){
  const m = window.__batchPickerMatches[i];
  enterAsMember(m.batch.id, m.student.id, m.student.name);
}

async function enterAsMember(batchId, studentId, name){
  S.isAdmin = false;
  S.student = { batchId, studentId, name };
  S.currentBatchId = batchId;
  await enterApp();
}

async function submitPublicRegistration(batchId){
  const name = document.getElementById('pr-name').value.trim();
  const phone = document.getElementById('pr-phone').value.trim();
  const email = document.getElementById('pr-email').value.trim();
  const agentId = document.getElementById('pr-agentid').value.trim();
  const leader = document.getElementById('pr-leader').value.trim();
  const notes = document.getElementById('pr-notes').value.trim();
  const errEl = document.getElementById('pr-err');
  if(!name || !phone){ errEl.textContent = 'Please fill in at least your name and phone number'; errEl.style.display='block'; return; }
  const data = await loadBatchData(batchId);
  if(data.students.find(s=>s.phone.replace(/\s/g,'')===phone.replace(/\s/g,''))){
    errEl.textContent = 'This phone number has already registered for this batch';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  data.students.push({
    id: uid('s'), name, phone, email, agentId, leader, notes,
    status: 'pending', password: null,
    registeredAt: new Date().toISOString(), approvedAt: null
  });
  await saveBatchData(batchId, data);
  const batches = await loadBatches();
  const b = batches.find(x=>x.id===batchId);
  await logNote(batchId, b ? b.name : '', 'register', `${name} submitted a registration (pending approval)`);
  showRegistrationReceived();
}

}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function toggleArchiveBatch(id){
  const batches = await loadBatches();
  const b = batches.find(x=>x.id===id);
  if(!b) return;
  b.archived = !b.archived;
  await saveBatches(batches);
  await logNote(id, b.name, 'batch', b.archived ? 'Batch archived (data kept)' : 'Batch unarchived');
  toast(b.archived ? 'Archived' : 'Unarchived');
  await viewBatches(document.getElementById('content'));
}

async function getNextBatchNumber(){
  const n = await getJSON('next-batch-number', true);
  return (n===null || n===undefined) ? 12 : n;
}
async function setNextBatchNumber(n){ await setJSON('next-batch-number', n, true); }

async function openBatchModal(){
  const nextNum = await getNextBatchNumber();
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>New Batch</h3>
        <div class="field"><label>Batch Name</label><input id="nb-name" value="Batch ${nextNum}"></div>
        <div class="field"><label>Start Date</label><input id="nb-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label>Number of Sessions</label><input id="nb-sessions" type="number" min="1" value="4"></div>
        <div class="field"><label>Number of Tests</label><input id="nb-tests" type="number" min="1" value="3"></div>
        <div class="btn-row">
          <button class="btn" style="flex:1;" onclick="closeModal()">Cancel</button>
          <button class="btn btn-amber" style="flex:1;" onclick="createBatch(${nextNum})">Create</button>
        </div>
      </div>
    </div>
  `;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

async function createBatch(nextNum){
  const name = document.getElementById('nb-name').value.trim();
  const date = document.getElementById('nb-date').value;
  const sessions = parseInt(document.getElementById('nb-sessions').value) || 4;
  const tests = parseInt(document.getElementById('nb-tests').value) || 3;
  if(!name){ toast('Please enter a batch name'); return; }
  const batches = await loadBatches();
  const batch = {
    id: uid('b'), name, startDate: date, sessions, tests,
    status: 'active', archived: false, code: genCode(6), studentCount: 0, createdAt: new Date().toISOString()
  };
  batches.unshift(batch);
  await saveBatches(batches);
  await saveBatchData(batch.id, { students:[], attendance:{}, attendanceDates:[], checkinCodes:{}, marks:{} });
  await logNote(batch.id, batch.name, 'batch', `New batch created`);
  if(nextNum){ await setNextBatchNumber(nextNum + 1); }
  closeModal();
  toast('Batch created successfully');
  await viewBatches(document.getElementById('content'));
}

async function changeBatchStatus(id, status){
  const batches = await loadBatches();
  const b = batches.find(x=>x.id===id);
  if(!b) return;
  b.status = status;
  await saveBatches(batches);
  await logNote(id, b.name, 'batch', `Batch status changed to "${statusLabel(status)}"`);
  toast('Status updated');
}

async function deleteBatch(id){
  if(!confirm('Are you sure you want to delete this batch? This cannot be undone.')) return;
  let batches = await loadBatches();
  const b = batches.find(x=>x.id===id);
  batches = batches.filter(x=>x.id!==id);
  await saveBatches(batches);
  try{ await window.storage.delete('batch-'+id, true); }catch(e){}
  if(b) await logNote(id, b.name, 'batch', `BatchDeleted`);
  toast('Deleted');
  await viewBatches(document.getElementById('content'));
}

function goBatch(id, view){
  S.currentBatchId = id;
  switchView(view);
}

function batchSelectHtml(selectedId, onchangeFn){
  const opts = S.batches.map(b=>`<option value="${b.id}" ${b.id===selectedId?'selected':''}>${escapeHtml(b.name)}</option>`).join('');
  return `<select class="btn" onchange="${onchangeFn}(this.value)"><option value="">-- Select batch --</option>${opts}</select>`;
}

    <table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Agent ID</th><th>Team/Leader</th><th>Notes</th><th>Submitted</th><th></th></tr></thead>
    <tbody>
      ${pending.map(s=>`
        <tr>
          <td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.phone)}</td><td>${escapeHtml(s.email||'-')}</td>
          <td>${escapeHtml(s.agentId||'-')}</td><td>${escapeHtml(s.leader||'-')}</td><td>${escapeHtml(s.notes||'-')}</td>

function renderApprovedTable(approved){

async function approveStudent(studentId){
  const data = await loadBatchData(S.currentBatchId);
  const s = data.students.find(x=>x.id===studentId);
  if(!s) return;
  s.status = 'approved';
  s.password = genCode(6);
  s.approvedAt = new Date().toISOString();
  await saveBatchData(S.currentBatchId, data);
  await recalcStudentCount(S.currentBatchId);
  const batch = S.batches.find(b=>b.id===S.currentBatchId);
  await logNote(S.currentBatchId, batch.name, 'approval', `${s.name} approved`);
  toast('Approved');
  showCredentialsModal(s, batch);
  await renderRegBody();
}

async function rejectStudent(studentId){
  if(!confirm('Reject this registration?')) return;
  const data = await loadBatchData(S.currentBatchId);
  const s = data.students.find(x=>x.id===studentId);
  if(s) s.status = 'rejected';
  await saveBatchData(S.currentBatchId, data);
  toast('Rejected');
  await renderRegBody();
}

async function editPendingStudent(studentId){

async function saveEditPending(studentId){

  if(!s) return;
  s.name = document.getElementById('ep-name').value.trim();

  s.leader = document.getElementById('ep-leader').value.trim();

function transferStudent(studentId){
  const otherBatches = S.batches.filter(b=>b.id!==S.currentBatchId);
  if(otherBatches.length===0){ toast('No other batches to transfer to'); return; }
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-mask" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Transfer Member</h3>
        <div class="field"><label>Move to batch</label>
          <select id="tr-target">${otherBatches.map(b=>`<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('')}</select>
        </div>
        <p style="font-size:.8rem;color:var(--muted);">This creates a new pending registration in the target batch for your approval, and removes them from the current batch.</p>
        <button class="btn btn-amber" style="width:100%;" onclick="doTransfer('${studentId}')">Transfer</button>
      </div>
    </div>
  `;
}

async function doTransfer(studentId){
  const targetId = document.getElementById('tr-target').value;
  if(!targetId){ toast('Pick a target batch'); return; }
  const data = await loadBatchData(S.currentBatchId);
  const s = data.students.find(x=>x.id===studentId);
  if(!s) return;
  data.students = data.students.filter(x=>x.id!==studentId);
  await saveBatchData(S.currentBatchId, data);
  await recalcStudentCount(S.currentBatchId);

  const targetData = await loadBatchData(targetId);
  targetData.students.push({ ...s, id: uid('s'), status:'pending', password:null, registeredAt: new Date().toISOString(), approvedAt:null });
  await saveBatchData(targetId, targetData);
  await recalcStudentCount(targetId);

  closeModal();
  toast('Transferred — awaiting approval in the new batch');
  await renderRegBody();
}

async function resendCredentials(studentId){
  const data = await loadBatchData(S.currentBatchId);
  const s = data.students.find(x=>x.id===studentId);
  const batch = S.batches.find(b=>b.id===S.currentBatchId);
  if(!s || !batch) return;
  if(!s.password){ s.password = genCode(6); await saveBatchData(S.currentBatchId, data); }
  showCredentialsModal(s, batch);
}

async function adminAddStudent(){
  const name = document.getElementById('ar-name').value.trim();
  const phone = document.getElementById('ar-phone').value.trim();
  const email = document.getElementById('ar-email').value.trim();
  const agentId = document.getElementById('ar-agentid').value.trim();
  const leader = document.getElementById('ar-leader').value.trim();
  if(!name || !phone){ toast('Please fill in at least name and phone'); return; }
  const data = await loadBatchData(S.currentBatchId);
  if(data.students.find(s=>s.phone.replace(/\s/g,'')===phone.replace(/\s/g,''))){ toast('This phone number is already registered'); return; }
  const newStudent = {
    id: uid('s'), name, phone, email, agentId, leader, notes:'',
    status:'approved', password: genCode(6),
    registeredAt: new Date().toISOString(), approvedAt: new Date().toISOString()
  };
  data.students.push(newStudent);
  await saveBatchData(S.currentBatchId, data);
  await recalcStudentCount(S.currentBatchId);
  const batch = S.batches.find(b=>b.id===S.currentBatchId);
  await logNote(S.currentBatchId, batch.name, 'register', `Admin added member ${name}`);
  toast('Added');
  showCredentialsModal(newStudent, batch);
  await renderRegBody();
}

async function removeStudent(studentId){
  if(!confirm('Are you sure you want to remove this member?')) return;
  const data = await loadBatchData(S.currentBatchId);
  data.students = data.students.filter(s=>s.id!==studentId);
  await saveBatchData(S.currentBatchId, data);
  await recalcStudentCount(S.currentBatchId);
  toast('Removed');
  await renderRegBody();
}

function resizeImageFile(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoUpload(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  toast('Uploading photos...');
  const photos = await loadBatchPhotos(S.currentBatchId);
  for(const file of files){
    try{
      const dataUrl = await resizeImageFile(file, 900);
      photos.push({ id: uid('p'), dataUrl, addedAt: new Date().toISOString() });
    }catch(e){ console.error(e); }
  }
  while(photos.length > 30) photos.shift();
  await saveBatchPhotos(S.currentBatchId, photos);
  input.value = '';
  const batch = S.batches.find(b=>b.id===S.currentBatchId);
  await logNote(S.currentBatchId, batch.name, 'materials', `${files.length} photo(s) uploaded`);
  toast('Photos saved');
  await renderMaterialsBody();
}

async function updateTimetableField(session, field, value){

  if(!row){ row = { session, date:'', time:'', topic:'' }; mat.timetable.push(row); }
  row[field] = value;
  await saveBatchMaterials(S.currentBatchId, mat);
}

async function changeAttBatch(id){ S.currentBatchId = id; S.attDate = ''; await renderAttBody(); }

async function addAttDate(){
  const input = document.getElementById('att-new-date');
  const dateStr = input.value;
  if(!dateStr){ toast('Pick a date first'); return; }
  const data = await loadBatchData(S.currentBatchId);
  if(!data.attendanceDates.includes(dateStr)){
    data.attendanceDates.push(dateStr);
    data.attendanceDates.sort();
    await saveBatchData(S.currentBatchId, data);
  }
  S.attDate = dateStr;
  toast('Date added');
  await renderAttBody();
}

async function renderAttBody(){
  const body = document.getElementById('att-body');
  if(!S.currentBatchId){ body.innerHTML = `<div class="empty-state"><div class="big">🗓️</div>Please select a batch first.</div>`; return; }
  const data = await loadBatchData(S.currentBatchId);
  const approvedStudents = data.students.filter(s=>(s.status||'approved')==='approved');
  if(!S.attDate || !data.attendanceDates.includes(S.attDate)){
    S.attDate = data.attendanceDates[data.attendanceDates.length-1] || '';
  }
  const d = S.attDate;
  const code = d ? data.checkinCodes[d] : null;
  const attForDate = d ? (data.attendance[d] || {}) : {};
  const presentCount = Object.values(attForDate).filter(Boolean).length;

  body.innerHTML = `
    <div class="card" style="margin-bottom:14px;">
      <div class="btn-row" style="align-items:flex-end;">
        <div class="field" style="margin-bottom:0;"><label>Add a session date</label><input type="date" id="att-new-date" value="${new Date().toISOString().slice(0,10)}"></div>
        <button class="btn btn-amber" onclick="addAttDate()">+ Add Date</button>
      </div>
    </div>
    ${data.attendanceDates.length===0 ? `<div class="empty-state"><div class="big">🗓️</div>No dates added yet — add your first session date above.</div>` : `
    <div class="tab-strip">${data.attendanceDates.map(ds=>`<button class="${ds===d?'active':''}" onclick="setAttDate('${ds}')">${dateLabel(ds)}</button>`).join('')}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;">
      <div class="card">
        <h3 style="margin-top:0;">Check-in Code — ${dateLabel(d)}</h3>
        ${code ? `
          <div class="code-display mono">${code}</div>
          <div id="qrcode" style="margin-top:16px;"></div>
          <p style="color:var(--muted);font-size:.82rem;margin-top:10px;">Members enter this code under "Member Login → Check-in" to check in. Once deployed to a real domain, this QR code can be scanned directly.</p>
          <button class="btn btn-sm" style="margin-top:6px;" onclick="regenCode('${d}')">Regenerate Code</button>
        ` : `
          <p style="color:var(--muted);font-size:.88rem;">No check-in code generated for this date yet.</p>
          <button class="btn btn-amber" onclick="regenCode('${d}')">Generate Check-in Code</button>
        `}
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Attendance Summary</h3>
        <div class="stat-num">${presentCount} / ${approvedStudents.length}</div>
        <div class="stat-label">Present on ${dateLabel(d)}</div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3 style="margin-top:0;">Member Attendance — ${dateLabel(d)}</h3>
      ${approvedStudents.length===0 ? `<div class="empty-state">No members</div>` : `
      <table><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${approvedStudents.map(s=>{
          const present = !!attForDate[s.id];
          return `<tr>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.phone)}</td>
            <td>${present ? `<span class="tick-yes">✓ Present</span>` : `<span class="tick-no">· Absent</span>`}</td>
            <td><button class="btn btn-sm" onclick="toggleAttendance('${s.id}','${d}')">${present?'Mark Absent':'Mark Present'}</button></td>
          </tr>`;
        }).join('')}
      </tbody></table>`}
    </div>
    <div class="card" style="margin-top:16px;overflow-x:auto;">
      <h3 style="margin-top:0;">Full Attendance Grid</h3>
      ${approvedStudents.length===0 ? `<div class="empty-state">No members</div>` : `
      <table><thead><tr><th>Name</th>${data.attendanceDates.map(ds=>`<th>${dateLabel(ds)}</th>`).join('')}</tr></thead>
      <tbody>
        ${approvedStudents.map(s=>`
          <tr>
            <td>${escapeHtml(s.name)}</td>
            ${data.attendanceDates.map(ds=>{
              const present = !!(data.attendance[ds] && data.attendance[ds][s.id]);
              return `<td style="text-align:center;cursor:pointer;" onclick="toggleAttendance('${s.id}','${ds}')">${present?'<span class="tick-yes">✓</span>':'<span class="tick-no">·</span>'}</td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody></table>`}
    </div>
    `}
  `;
  if(code && window.QRCode){
    const qrEl = document.getElementById('qrcode');
    qrEl.innerHTML = '';
    new QRCode(qrEl, { text: code, width: 128, height: 128, colorDark: '#1F3D2F', colorLight: '#ffffff' });
  }
}

  c.innerHTML = `
    <div class="view-head">

      ${batchSelectHtml(S.currentBatchId, 'changeRankingBatch')}
    </div>
    <div id="ranking-body"></div>
  `;
  await renderRankingBody();
}
async function changeRankingBatch(id){ S.currentBatchId = id; await renderRankingBody(); }

async function computeRankingRows(batchId){
  const data = await loadBatchData(batchId);
  const appts = await loadAppointments(batchId);
  const recruits = await loadRecruitment(batchId);
  const ranking = await loadRanking(batchId);

  return data.students.filter(s=>(s.status||'approved')==='approved').map(s=>{
    const r = ranking[s.id] || {};
    const apptCount = appts.filter(a=>a.madeBy===s.id).length;
    const apptScore = apptCount*2;
    const recruitCount = recruits.filter(x=>x.madeBy===s.id).length;
    const recruitScore = recruitCount*3;
    const readingCount = Number(r.readingCount||0);
    const readingScore = readingCount*2;
    const socialCount = Number(r.socialCount||0);
    const socialScore = socialCount*2;
    const presentation = Number(r.presentation||0);
    const salesCalling = Number(r.salesCalling||0);
    const salesLeads = Number(r.salesLeads||0);
    const salesPresentation = Number(r.salesPresentation||0);
    const salesScore = salesCalling+salesLeads+salesPresentation;
    const homework = Number(r.homework||0);
    const activityScore = readingScore+socialScore+salesScore+homework;
    const attendanceCount = data.attendanceDates.filter(ds=>data.attendance[ds] && data.attendance[ds][s.id]).length;
    const attendanceScore = attendanceCount*1;
    const total = apptScore+recruitScore+attendanceScore+activityScore+presentation;
    return { student:s, apptCount, apptScore, recruitCount, recruitScore, readingCount, readingScore, socialCount, socialScore, presentation, salesCalling, salesLeads, salesPresentation, salesScore, homework, activityScore, attendanceCount, attendanceScore, total };
  }).sort((a,b)=>b.total-a.total);
}

async function updateRankingField(studentId, field, value){
  const ranking = await loadRanking(S.currentBatchId);
  if(!ranking[studentId]) ranking[studentId] = {};
  ranking[studentId][field] = Number(value)||0;
  await saveRanking(S.currentBatchId, ranking);
  await renderRankingBody();
}

async function changeMarksBatch(id){ S.currentBatchId = id; S.marksTest = 1; await renderMarksBody(); }

async function renderMarksBody(){
  const body = document.getElementById('marks-body');
  if(!S.currentBatchId){ body.innerHTML = `<div class="empty-state"><div class="big">📝</div>Please select a batch first.</div>`; return; }
  const batch = S.batches.find(b=>b.id===S.currentBatchId);
  const data = await loadBatchData(S.currentBatchId);
  const approvedStudents = data.students.filter(s=>(s.status||'approved')==='approved');
  const tests = Array.from({length: batch.tests}, (_,i)=>i+1);
  const t = S.marksTest;
  const marksForTest = data.marks[t] || {};
  const scored = approvedStudents.map(s=>marksForTest[s.id]).filter(v=>v!==undefined && v!=='');
  const avg = scored.length ? (scored.reduce((a,b)=>a+Number(b),0)/scored.length).toFixed(1) : '-';

  body.innerHTML = `
    <div class="tab-strip">${tests.map(n=>`<button class="${n===t?'active':''}" onclick="setMarksTest(${n})">Test ${n}</button>`).join('')}</div>
    <div class="card" style="margin-bottom:16px;">
      <div class="stat-num">${avg}</div><div class="stat-label">Test ${t} average score (out of 100)</div>
    </div>
    <div class="card">
      ${approvedStudents.length===0 ? `<div class="empty-state">No members</div>` : `
      <table><thead><tr><th>Name</th><th>Phone</th><th>Score</th></tr></thead>
      <tbody>
        ${approvedStudents.map(s=>`
          <tr>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.phone)}</td>
            <td><input type="number" min="0" max="100" style="width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;"
              value="${marksForTest[s.id] ?? ''}" onblur="saveMark('${s.id}', this.value)"></td>
          </tr>`).join('')}
      </tbody></table>`}
    </div>
  `;
}

function setMarksTest(n){ S.marksTest = n; renderMarksBody(); }

async function saveMark(studentId, value){
  const data = await loadBatchData(S.currentBatchId);
  const t = S.marksTest;
  if(!data.marks[t]) data.marks[t] = {};
  if(value === ''){ delete data.marks[t][studentId]; }
  else { data.marks[t][studentId] = Math.max(0, Math.min(100, Number(value))); }
  await saveBatchData(S.currentBatchId, data);
  toast('Score saved');
}

async function exportExcel(){
  const batch = S.batches.find(b=>b.id===S.currentBatchId);
  const data = await loadBatchData(S.currentBatchId);
  const approvedStudents = data.students.filter(s=>(s.status||'approved')==='approved');
  const appts = await loadAppointments(S.currentBatchId);
  const recruits = await loadRecruitment(S.currentBatchId);
  const ranking = await loadRanking(S.currentBatchId);
  const wb = XLSX.utils.book_new();

  const roster = data.students.map(s=>({ Name:s.name, Phone:s.phone, Email:s.email||'', 'Agent ID':s.agentId||'', 'Team/Leader':s.leader||'', Status: (s.status||'approved'), 'Registered On': fmtDate(s.registeredAt) }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(roster.length?roster:[{'Name':''}]), 'Roster');

  const attRows = approvedStudents.map(s=>{
    const row = { Name: s.name, Phone: s.phone };
    data.attendanceDates.forEach(ds => row[dateLabel(ds)] = (data.attendance[ds] && data.attendance[ds][s.id]) ? 'Present' : 'Absent');
    return row;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(attRows.length?attRows:[{'Name':''}]), 'Attendance');

  const markRows = approvedStudents.map(s=>{
    const row = { Name: s.name, Phone: s.phone };
    for(let i=1;i<=batch.tests;i++) row['Test'+i] = (data.marks[i] && data.marks[i][s.id]!==undefined) ? data.marks[i][s.id] : '';
    return row;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(markRows.length?markRows:[{'Name':''}]), 'Marks');

  const apptRows = appts.map(a=>({ 'Made By': studentNameById(data,a.madeBy), 'Client Name': a.clientName, Contact: a.contact, 'Leads Origin': a.origin, Closer: a.closer, Date: fmtDate(a.date) }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(apptRows.length?apptRows:[{'Made By':''}]), 'Appointments');

  const recruitRows = recruits.map(r=>({ 'Made By': studentNameById(data,r.madeBy), 'Recruit Name': r.clientName, Contact: r.contact, 'Leads Origin': r.origin, Closer: r.closer, Date: fmtDate(r.date) }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(recruitRows.length?recruitRows:[{'Made By':''}]), 'Recruitment');

  const rankRows = approvedStudents.map(s=>{
    const r = ranking[s.id] || {};
    const apptCount = appts.filter(a=>a.madeBy===s.id).length;
    const recruitCount = recruits.filter(x=>x.madeBy===s.id).length;
    const attendanceScore = data.attendanceDates.filter(ds=>data.attendance[ds] && data.attendance[ds][s.id]).length;
    const readingScore = Number(r.readingCount||0)*2;
    const socialScore = Number(r.socialCount||0)*2;
    const presentation = Number(r.presentation||0);
    const salesScore = Number(r.salesCalling||0)+Number(r.salesLeads||0)+Number(r.salesPresentation||0);
    const homework = Number(r.homework||0);
    const activityScore = readingScore+socialScore+salesScore+homework;
    const total = apptCount*2 + recruitCount*3 + attendanceScore + activityScore + presentation;
    return { Name:s.name, Appointment: apptCount*2, Recruitment: recruitCount*3, Attendance: attendanceScore, Activity: activityScore, Presentation: presentation, Total: total };
  }).sort((a,b)=>b.Total-a.Total);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rankRows.length?rankRows:[{'Name':''}]), 'Ranking Board');

  XLSX.writeFile(wb, batch.name.replace(/[^\w\u4e00-\u9fa5]/g,'_') + '__Report.xlsx');
  await logNote(S.currentBatchId, batch.name, 'export', 'Excel report exported');
  toast('Excel downloaded');
}

async function runSearch(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const resultsEl = document.getElementById('search-results');
  if(!q){ resultsEl.innerHTML = ''; return; }
  resultsEl.innerHTML = `<div class="empty-state">Searching...</div>`;
  const batches = await loadBatches();
  let matches = [];
  for(const b of batches){
    const data = await loadBatchData(b.id);
    for(const s of data.students){
      if(s.name.toLowerCase().includes(q) || s.phone.includes(q)){
        matches.push({ batch: b, student: s });
      }
    }
  }
  if(matches.length===0){ resultsEl.innerHTML = `<div class="empty-state"><div class="big">🔍</div>No matching members found</div>`; return; }
  resultsEl.innerHTML = `
    <div class="card">
      <table><thead><tr><th>Name</th><th>Phone</th><th>Batch</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${matches.map(m=>`
          <tr>
            <td>${escapeHtml(m.student.name)}</td>
            <td>${escapeHtml(m.student.phone)}</td>
            <td>${escapeHtml(m.batch.name)}</td>
            <td>${escapeHtml(m.student.status||'approved')}</td>
            <td><button class="btn btn-sm" onclick="goBatch('${m.batch.id}','registration')">View</button></td>
          </tr>`).join('')}
      </tbody></table>
    </div>
  `;
}

    return;
  }
  if(!data.checkinCodes[d] || data.checkinCodes[d] !== code){
    toast('Incorrect check-in code');
    return;

  if(!data.attendance[d]) data.attendance[d] = {};

  await saveBatchData(S.student.batchId, data);
  const batch = (await loadBatches()).find(b=>b.id===S.student.batchId);

(async function initApp(){
  try{
    const params = new URLSearchParams(location.search);
    const code = params.get('batch');
    const mode = params.get('mode');
    if(code){
      const batches = await loadBatches();
      S.batches = batches;
      const batch = batches.find(b => b.code && b.code.toUpperCase()===code.toUpperCase() && b.status==='active' && !b.archived);
      if(batch){
        if(mode === 'login'){
          await showPublicAccess(batch.id);
        } else {
          await showPublicRegister(batch.id);
        }
        return;
      }
    }
  }catch(e){ console.error(e); }
  renderLoginForm();
})();
